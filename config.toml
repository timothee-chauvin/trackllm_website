prompts = ["x", "Hi"]
data_dir = "website/data"
log_level = "INFO"

[api]
max_retries = 8
max_cost_mtok = 30
max_cost_per_query = 0.0001  # billed $/query; any successful query above this raises QueryTooExpensive
lt_prune_window_days = 7  # trailing ledger window for the LT per-query prune
lt_stall_days = 7  # drop an LT endpoint once its last N queried days had no success (mirrors bi.reinit.stall_days)
# Provider path segments excluded from LT: priority tiers serve the same weights
# as the base variant at ~2x the price, pure duplicates for change-tracking.
lt_exclude_provider_segments = ["priority"]
temperature = 1.0
max_workers = 80
top_logprobs_openrouter_default = 20
timeout = 15
openrouter_avoid_free_endpoints = true

[api.top_logprobs_openrouter]
fireworks = 5
azure = 5
inference-net = 5
xai = 8
alibaba = 5  # rejects top_logprobs > 5 with a 400; kept every alibaba endpoint out of LT

[bi]
data_dir = "website/data/b3it"
selection_path = "bi_selection.toml"
samples_per_day = 200  # BIs (top_k_bis=20) x samples/BI/day (queries_per_token=10), the monitoring cadence
days_per_month = 30
carry_forward_days = 7  # drop a carried candidate once it hasn't vetted good for this long

[bi.probe]
strategies_path = "strategies_test_reasoning.json"
prompt = "a"
max_budget = 2048
max_retries = 4

[bi.phase_1]
queries_per_token = 3
requests_per_second_per_endpoint = 5
max_concurrent_requests_per_endpoint = 10
max_concurrent_tokens_per_endpoint = 100
tokens_per_endpoint = 5000
request_delay_seconds = 5.0
target_border_inputs = 50
max_retries = 3
abandon_after_timeouts = 20

[bi.prevalence]
queries_per_token = 3
tokens_per_endpoint = 1000

[bi.temperature_gate]
prevalence_trigger = 0.30   # if > this fraction of sampled prompts are border inputs, run the check
check_prompts = 8           # how many border prompts to re-sample at T=1
check_samples = 8           # samples per prompt at each temperature
min_success_fraction = 0.5  # below this share of queries that returned a token at either temperature, the gate is inconclusive

[bi.phase_2]
queries_per_token = 10
requests_per_second_per_endpoint = 5
max_concurrent_requests_per_endpoint = 10
request_delay_seconds = 5.0
abandon_this_run_after = 100

[bi.detection]
window = 14
exclusion = 4
min_baseline = 5
sigma_k = 4.0
abs_delta = 0.2
persistence = 3
cooldown = 10
instability_window = 14
instability_threshold = 0.35  # on day-vs-other-days dispersion; ~p90 of the fleet (2026-07-30)

[bi.scan]  # early-epoch changepoint scan; thresholds calibrated in scan_sweep.py
min_batches = 4         # reference + 3 daily batches
max_batches = 30        # scan window end; the adaptive rule owns the rest
min_side_samples = 30   # per prompt (average) on each side of a candidate split
permutations = 999
alpha = 0.005           # sweep 2026-07-30: ~1-2/129 uncorroborated firings on stable epochs
backfill_alpha = 0.002  # one-shot historical scans: permutation floor plus one tie
backfill_min_separation_days = 7  # nearby splits of one rolling transition are one event

[bi.reinit]
reprobe_samples = 10
reference_samples = 100
top_k_bis = 20
min_bis = 10
stall_days = 7
recheck_days = 14
unprobeable_after_failures = 3  # consecutive failed vets before we stop probing
onboard_concurrency = 40
deselection_grace_days = 30
onboard_timeout_seconds = 10800

[bi.monitor]
max_concurrent_endpoints = 20
# Deadline for a change-triggered re-init, separate from the 3h onboarding budget:
# these run inside the daily monitor job, whose workflow limit is 300 minutes
# (bi-monitor.yml). Worst-case real re-init is full discovery (~15k queries,
# ~50 min at 5 rps) plus reference collection (target_border_inputs=50 x
# reference samples ~= 5k queries, ~17 min), ~67 min total, so 1h would cut off
# exactly the endpoints that just changed; 1.5h clears it with margin. Hung
# endpoints burn one deadline per wave of max_concurrent_endpoints: with ~40 min
# of daily sampling first, 2 waves of 20 = 40 hung endpoints fit inside the job
# deadline below, where the 3h onboarding budget would blow it at 21.
# A cut-off re-init resumes from its persisted phase-1 progress next run — but only
# if the run gets to commit it, which is what job_deadline_seconds below protects.
reinit_timeout_seconds = 5400
# A re-init that hits its timeout leaves the epoch open, so the next run re-detects
# the same change and retries (resuming from persisted phase-1 progress). Without a
# bound, a throttled endpoint burns the full timeout daily forever (deepseek-v4-flash
# @fireworks, rate-limited upstream, did this on 2026-07-31 and 08-01). Three tries
# is ~4.5h of cumulative discovery, more than a fresh onboarding's 3h budget; after
# that, retire and let the 14-day recheck re-onboard from scratch.
max_reinit_timeouts = 3
# The monitor must end itself before bi-monitor.yml's timeout-minutes: 300. A hard
# kill there is reported as "cancelled", which skips the commit step: every
# endpoint's saved batch, spend line and state update is thrown away, not just the
# work of whatever was still running (this is what lost 2026-07-30 entirely). The
# 30 minutes of headroom cover the digest, the commit and the push.
job_deadline_seconds = 16200  # 270 min

[bi.popularity]
top_n = 5

[budget]
# Month-end projection guard over ALL spend kinds (lt included), from the spend
# ledgers. Enforcement (dropping pending onboards/reinits, then retiring the
# hungriest endpoints) fires only when the projection exceeds hard_cap_per_month;
# target_per_month just turns the digest header amber between the two.
target_per_month = 60.0
hard_cap_per_month = 80.0
projection_window_days = 7  # trailing days the daily rate is averaged over

# The Overview hero curve: deepseek-chat-v3-0324 @ crusoe/fp8, 43 days either side
# of its 2026-01-11 changepoint (99 sigma). Vetted by eye; see generate_site/hero.py.
[hero]
slug = "deepseek2fdeepseek-chat-v3-032423crusoe2ffp8"
method = "lt"
start = 2025-11-29
end = 2026-02-23

[plotting]
template = "plotly_white"
font_family = "Spectral"
