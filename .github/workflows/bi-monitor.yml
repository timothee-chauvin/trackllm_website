name: BI Daily Monitor

on:
  schedule:
    # Run every 24 hours at 21:01 UTC
    - cron: '01 21 * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write  # Allow pushing commits

jobs:
  bi-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

    - name: Install dependencies
      run: uv sync

    - name: Run BI monitor
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      run: uv run python -m trackllm_website.bi.monitor

    - name: Commit and push changes
      # Commit saved monitor state even if a prior step failed — e.g. the in-process
      # digest email raising on an SMTP error must not discard a day of monitor work
      # (mirrors update-endpoints.yml). A deliberate cancel stays a clean abort.
      if: ${{ !cancelled() }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add website/data
        git diff --staged --quiet || git commit -m "[bot] Daily BI monitor run"
        bash .github/scripts/push-with-rebase.sh
