name: BI Daily Monitor

on:
  schedule:
    # Run every 24 hours at 21:01 UTC
    - cron: '01 21 * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write  # Allow pushing commits

# Freeze uv on the committed lockfile — see the comment in run-main.yml.
env:
  UV_FROZEN: "1"

# Shared with update-endpoints.yml — see the comment there.
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  bi-monitor:
    runs-on: ubuntu-latest
    # Backstop only: hitting it is reported as "cancelled", which skips the commit
    # step below and discards the whole run. The monitor stops itself 30 minutes
    # earlier — see job_deadline_seconds in config.toml, and keep the two in sync.
    timeout-minutes: 300

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Checkout data repo
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: timothee-chauvin/trackllm_data
        path: website/data
        ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

    - name: Install dependencies
      run: uv sync

    - name: Run BI monitor
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      run: uv run python -m trackllm_website.bi.monitor

    - name: Commit and push changes
      # Commit saved monitor state even if a prior step failed — e.g. the in-process
      # digest email raising on an SMTP error must not discard a day of monitor work
      # (mirrors update-endpoints.yml). A deliberate cancel stays a clean abort.
      if: ${{ !cancelled() }}
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        # Data repo first: the monitor state is the expensive part, and a failure
        # between the two pushes only delays the strategy cache, which the next
        # run rewrites anyway.
        (cd website/data
         git add -A
         git diff --staged --quiet || git commit -m "[bot] Daily BI monitor run"
         bash "$GITHUB_WORKSPACE/.github/scripts/push-with-rebase.sh")
        # resolve_strategies rewrites the probe-strategy cache whenever a probe
        # result changes; leaving it unstaged makes `git pull --rebase` refuse and
        # discards the whole run (runs #46/#47).
        git add strategies_test_reasoning.json
        git diff --staged --quiet || git commit -m "[bot] Daily BI monitor run"
        bash .github/scripts/push-with-rebase.sh
