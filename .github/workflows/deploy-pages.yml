name: Deploy to GitHub Pages

on:
  # Trigger after run-main.yml completes
  workflow_run:
    workflows: ["Run Main Script"]
    types: [completed]
    branches: [main]
  # Also trigger on direct pushes to relevant files
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/trackllm_website/generate_site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Freeze uv on the committed lockfile — see the comment in run-main.yml.
env:
  UV_FROZEN: "1"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run if triggered by push/dispatch, or if workflow_run succeeded
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Deploy the branch tip, NOT workflow_run.head_sha: head_sha is the commit
          # run-main *started from*, i.e. the parent of the "[bot] add new responses"
          # commit it pushes at the end of its run. Checking out head_sha publishes
          # data that is one run-main cycle stale. head_branch is the branch run-main
          # pushed to ("main"), whose tip includes that just-pushed data.
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build TypeScript
        working-directory: website
        run: |
          bun install
          bun run build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Generate static site
        run: uv run python -m trackllm_website.generate_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
