name: Run Main Script

on:
  schedule:
    # Run every hour at minute 17
    - cron: '17 * * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write  # Allow pushing commits

# Shared with update-endpoints.yml and bi-monitor.yml: all three commit to main and
# touch overlapping files (website/data/spend, monthly state). Queue instead of
# cancelling, so an overlapping manual dispatch can't race a cron run into a
# last-write-wins loss.
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  run-main:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

    - name: Install dependencies
      run: uv sync

    - name: Run main.py
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: uv run python src/trackllm_website/main.py

    - name: Compute LT scores
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: uv run python -m trackllm_website.lt_scores_cli latest

    - name: Commit and push results
      # Commit collected data even if a later step (e.g. LT scoring) failed, so a
      # downstream bug can never again silently stop the hourly data commits. The
      # job still reports failure if an earlier step failed (→ failure email).
      if: ${{ !cancelled() }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        # Scoped to what this job writes: main.py stores responses under
        # website/data/lt and appends the LT spend ledger under website/data/spend;
        # lt_scores_cli rewrites lt_scores.json / lt_changes.json under website/data/lt.
        git add website/data/lt website/data/spend
        git diff --staged --quiet || git commit -m "[bot] add new responses"
        bash .github/scripts/push-with-rebase.sh
