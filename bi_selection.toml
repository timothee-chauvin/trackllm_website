# BI monitoring selection policy. The ONLY place cost is managed.
# Rules run top to bottom; each adds endpoints (no duplicates) until
# budget_per_month is reached. Per-endpoint monthly cost = measured
# cost_per_request x config.bi.samples_per_month (20 BIs x 10 samples x 30 days).
#
# 2026-07-03: re-enabled with a single popularity rule (top-1 model by OpenRouter
# token usage, all providers — deepseek/deepseek-v4-flash at the time of writing).
# The full policy remains parked; restore it from:
#   - prior committed policy: git show 774f879754:bi_selection.toml
#   - in-progress draft (qwen pattern narrowed): /home/ubuntu/bi_selection_wip_backup_2026-06-21.toml
# 2026-07-10: widened to top-5 (config bi.popularity.top_n = 5); budget raised to
# $3/mo to cover full provider fan-out (simulated uncapped run-rate ~$1.5/mo).
# 2026-07-23: added provider-coverage (2 cheapest endpoints per provider,
# simulated +$2.7/mo on top of popular, ~$7-11 one-time onboarding); budget
# raised to $15/mo for headroom, since the providers wildcard silently skips
# endpoints once the budget is hit.
# 2026-07-30: added flagships (cheapest provider each, budget/ceiling-exempt):
# est. ~$4.7 one-time onboarding, ~$1.4/mo from measured cost_per_request.
# Deliberately left out (reasoning burn, ~100 billed tokens/request):
# x-ai/grok-4.5 (~$3.6/mo) and moonshotai/kimi-k3 (~$9/mo, unmeasured — vet
# manually first). qwen3.6-max-preview is too_expensive-cached until the next
# recheck clears it; the flagship ceiling exemption then admits it.
# 2026-08-27: z-ai/glm-5 widened to glm-5* (5, 5.1, 5.2, 5.3, 5v-turbo), cheapest
# provider each: est. ~$0.3/mo, ~$1 one-time onboarding.

budget_per_month = 15.0
max_endpoint_cost = 0.50

# Never selected anywhere (globs match "model" or "model#provider").
# Note: a rule's own `patterns` match the same way, EXCEPT for kind = "providers",
# where they match the provider name with its variant suffix stripped ("deepinfra",
# not "deepinfra/fp8").
exclude = [
    "*image*", "*-fast", "*:extended", "*customtools*", "*-beta",
    "switchpoint/router",
]

[[rule]]
name = "flagships"           # models people care about, cheapest provider each
kind = "models"
patterns = [
    "anthropic/claude-sonnet-4.6",
    "deepseek/deepseek-v4-flash-0731",
    "google/gemini-3.1-pro-preview",
    "mistralai/mistral-large-2512",
    "qwen/qwen3-max",
    "qwen/qwen3-max-thinking",
    "qwen/qwen3.5-397b-a17b",
    "qwen/qwen3.6-max-preview",
    "z-ai/glm-5*",
]
providers_per_model = 1
flagship = true              # exempt from budget_per_month and max_endpoint_cost

[[rule]]
name = "popular"             # top-N models by token usage; N = config bi.popularity.top_n
kind = "popular"
patterns = []                # unused: the popularity feed drives selection
providers_per_model = "all"

[[rule]]
name = "provider-coverage"   # every provider represented by its 2 cheapest endpoints
kind = "providers"
patterns = ["*"]
endpoints_per_provider = 2
max_monthly_cost = 0.25
